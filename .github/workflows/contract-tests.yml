name: Contract Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install chess numpy tqdm torch maturin pytest optuna

      - name: Build and install native engine
        run: |
          python -m pip install ./native
          python -c "import monster_native; print(monster_native.version())"

      - name: Compile native crate tests
        working-directory: native
        run: cargo test --locked

      - name: Run contract tests
        # Tests marked local_artifacts need weights, receipts and journals that are
        # never committed, so a fresh checkout skips them.
        run: |
          python -m pytest tests -q -m "not local_artifacts" -p no:cacheprovider
